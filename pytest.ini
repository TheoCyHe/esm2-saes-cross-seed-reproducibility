[pytest]
# Collection is SCOPED to the real test directory.
#
# WHY (this describes the working repository, where `analysis/adhoc/` holds the
# project's ad-hoc scripts; a release export carries almost none of them).
# A bare `pytest` from the repository root used to fail during COLLECTION,
# not during a test: `analysis/adhoc/` is tracked, it holds ad-hoc scripts kept
# as part of the record, and one of them -- `test_periodicity.py` -- is
# `test_`-prefixed and opens a cluster path at import time. pytest imported it,
# the open raised FileNotFoundError on `<cluster-fs>/.../cache/eval.h5`, and the run
# aborted with `Interrupted: 1 error during collection`. Someone running the
# suite the obvious way concluded it was broken.
#
# ESTABLISHED BEFORE SCOPING, because scoping collection silently stops running
# anything outside it, which would be worse than the failure it fixes:
# `analysis/adhoc/test_periodicity.py` is the ONLY `test_`-named file outside
# `tests/`, and it defines ZERO test functions -- it is a script that runs at
# import. Every file in the repository containing a `def test_` is already
# under `tests/`. So this drops no tests, and the counts are equal either way.
#
# This is the general fix rather than a rename: the next ad-hoc script named
# `test_something.py` is handled without anyone remembering the rule. Running
# `pytest analysis/adhoc/...` explicitly still does what it says.
testpaths = tests
