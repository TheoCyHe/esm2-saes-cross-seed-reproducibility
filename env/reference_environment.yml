# The REFERENCE tier's environment (PREREGISTRATION.md §CT18-D4 item 3): the conda environment
# `esm-interp` that env/activate.sh activates on Bouchet (Linux x86_64), exported 2026-11-01 with
# `conda env export --no-builds` (analysis/adhoc/probes/2026-11-01/release/env_export.{sh,out};
# the exact package URLs are in reference_conda_explicit.txt beside it; those three files are in the
# working repository and are not released). In it, with one BLAS thread,
# scripts/reproduce_table1.py reproduced every owner value bit for bit (jobs 31294938 and 31298208).
# Only the name (esm-interp -> esm2-sae-reference), the machine-specific `prefix:` line and the
# PyTorch index line (for torch==2.13.0+cu126, as env/environment.yml has it) differ from the export.
# The script's REFERENCE_ENV must equal the pins below (tests/test_reproduce_table1.py).
#
#   conda env create -f env/reference_environment.yml && conda activate esm2-sae-reference
